name: Sync Discord to Website

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync lineups, FIA announcements and media
        run: node scripts/update-lineups.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LINEUPS_CHANNEL_ID: ${{ vars.LINEUPS_CHANNEL_ID }}
          FIA_CHANNEL_ID: ${{ vars.FIA_CHANNEL_ID }}
          MEDIA_CHANNEL_ID: ${{ vars.MEDIA_CHANNEL_ID }}

      - name: Commit website data and media
        run: |
          git config user.name "vms-lineup-bot"
          git config user.email "vms-lineup-bot@users.noreply.github.com"
          git add data/lineups.json data/fia.json data/media.json media/
          git diff --cached --quiet || (git commit -m "Sync Discord updates to website" && git push)

